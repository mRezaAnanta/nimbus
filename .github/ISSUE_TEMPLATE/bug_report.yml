name: Bug report
description: Something is broken or wrong in a lesson or the app
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Which lesson or page
      placeholder: for example, /trafficflow/bottleneck
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options:
        - Indonesian
        - English
        - Both
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: for example, iPhone Safari, or Windows Chrome
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
